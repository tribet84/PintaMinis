name: paintforge
description: "PintaMinis — miniature paint inventory (Citadel, Vallejo, The Army Painter, Green Stuff World)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  provider: ^6.1.5+1
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  image_picker: ^1.2.3
  image: ^4.9.1
  firebase_storage: ^13.4.6
  firebase_app_check: ^0.4.6
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  crop_your_image: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/catalog/citadel.json
    - assets/catalog/vallejo.json
    - assets/catalog/army_painter.json
    - assets/catalog/green_stuff_world.json
    - assets/catalog/ak.json
    - assets/brand/logo.svg
